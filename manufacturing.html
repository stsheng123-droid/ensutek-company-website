<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturing - ENSU Mounting Technology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===================== 全局初始化 ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }
        a {
            text-decoration: none;
        }
        ul {
            list-style: none;
        }
        button {
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        /* ===================== 顶部导航Header（与各页一致） ===================== */
        header {
            position: relative;             /* 移动端下拉菜单的定位参照 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 48px;
            background: #ffffff;
        }
        .logo-group {
            line-height: 1;
        }
        .logo-main {
            font-size: 32px;
            font-weight: 800;
            color: #0099cc;
        }
        .logo-sub {
            font-size: 11px;
            color: #556677;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        nav ul {
            display: flex;
            gap: 34px;
        }
        nav a {
            color: #425a6b;
            font-size: 15px;
            font-weight: 500;
        }
        nav a:hover {
            color: #0099cc;
        }
        nav a.active {
            color: #0099cc;
            font-weight: 700;
        }
        .btn-quote-top {
            background-color: #00b1d9;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 14px;
        }
        .btn-quote-top:hover {
            background: #009cbf;
        }
        .menu-toggle {
            display: none;
            font-size: 28px;
            color: #425a6b;
            cursor: pointer;
            user-select: none;
        }

        /* ===================== 制造能力页面（参考图格式） ===================== */
        .mf-section {
            background: #E8F1FF;           /* 与其它页背景一致（浅蓝） */
            padding: 28px 140px 80px;      /* 左右留白放大，上方图片与下方卡片距离页面两边更远 */
        }
        /* 大标题 */
        .mf-title {
            font-size: 68px;
            font-weight: 800;
            line-height: 1;
            color: #12344d;
            letter-spacing: -1px;
        }
        /* 四张车间照片并排 */
        .mf-gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 44px;
        }
        .mf-gallery figure {
            margin: 0;
        }
        .mf-gallery img {
            width: 100%;
            aspect-ratio: 360 / 507;       /* 保持参考图竖版比例 */
            object-fit: cover;
            display: block;
            border-radius: 10px;
            background: #fff;
        }
        .mf-gallery figcaption {
            margin-top: 10px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #12344d;
        }
        /* 四张浅蓝卡片（2x2） */
        .mf-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 44px;
        }
        .mf-card {
            background: #CFE2F5;           /* 浅蓝底卡片，比页面背景 #E8F1FF 稍微深一点 */
            border-radius: 12px;
            padding: 26px 28px;
        }
        .mf-num {
            font-size: 44px;
            font-weight: 800;
            line-height: 1;
            color: #0099cc;
        }
        .mf-name {
            display: block;
            margin-top: 8px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            color: #12344d;
        }

        /* ===================== 响应式 平板 <=992px ===================== */
        @media (max-width:992px) {
            header {
                padding: 18px 24px;
            }
            nav {
                display: block;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #ffffff;
                box-shadow: 0 6px 16px rgba(18,52,77,.08);
                max-height: 0;
                overflow: hidden;
                transition: max-height .3s ease;
                z-index: 99;
            }
            nav ul {
                flex-direction: column;
                gap: 0;
                padding: 8px 24px;
            }
            nav li {
                border-bottom: 1px solid #eef3f7;
            }
            nav li a {
                display: block;
                padding: 14px 0;
            }
            nav.menu-open {
                max-height: 600px;
            }
            .menu-toggle {
                display: block;
            }
            .mf-section {
                padding: 24px 24px 60px;
            }
            .mf-title {
                font-size: 52px;
            }
            /* 四图改为两行两列 */
            .mf-gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* ===================== 响应式 手机 <=768px ===================== */
        @media (max-width:768px) {
            header {
                padding: 14px 16px;
            }
            .btn-quote-top {
                padding: 10px 16px;
                font-size: 13px;
            }
            .mf-section {
                padding: 18px 16px 40px;
            }
            .mf-title {
                font-size: 38px;
            }
            .mf-gallery {
                grid-template-columns: 1fr;   /* 单列竖排 */
            }
            .mf-stats {
                grid-template-columns: 1fr;   /* 卡片单列 */
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航区域（Manufacturing 高亮） -->
    <header>
        <div class="logo-group">
            <div class="logo-main">ENSU.</div>
            <div class="logo-sub">MOUNTING TECHNOLOGY</div>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about us.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="#">R&D</a></li>
                <li><a href="manufacturing.html" class="active">Manufacturing</a></li>
                <li><a href="quality.html">Quality</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('menu-open')">☰</div>
        <button class="btn-quote-top">REQUEST A QUOTE</button>
    </header>

    <!-- 制造能力：标题 + 四图 + 四卡片 -->
    <section class="mf-section">
        <h1 class="mf-title">MANUFACTURING CAPABILITY</h1>

        <!-- 四张车间照片（m1 - m4） -->
        <div class="mf-gallery">
            <figure>
                <img src="images/m1.png" alt="Stamping workshop">
                <figcaption>STAMPING</figcaption>
            </figure>
            <figure>
                <img src="images/m2.png" alt="Die-casting workshop">
                <figcaption>DIE-CASTING</figcaption>
            </figure>
            <figure>
                <img src="images/m3.png" alt="CNC workshop">
                <figcaption>CNC</figcaption>
            </figure>
            <figure>
                <img src="images/m4.png" alt="Painting workshop">
                <figcaption>PAINTING</figcaption>
            </figure>
        </div>

        <!-- 四张设备数据卡片 -->
        <div class="mf-stats">
            <div class="mf-card">
                <div class="mf-num">35</div>
                <span class="mf-name">HIGH-PRESSURE<br>DIE-CASTING MACHINES</span>
            </div>
            <div class="mf-card">
                <div class="mf-num">65</div>
                <span class="mf-name">HIGH-PRECISION<br>CNC MACHINES</span>
            </div>
            <div class="mf-card">
                <div class="mf-num">6</div>
                <span class="mf-name">ROBOTIC PAINTING /<br>POWDER-COATING LINES</span>
            </div>
            <div class="mf-card">
                <div class="mf-num">5</div>
                <span class="mf-name">ASSEMBLY<br>LINES</span>
            </div>
        </div>
    </section>
</body>
</html>
