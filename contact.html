<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ENSU Mounting Technology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===================== 全局初始化 ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', Arial, sans-serif;
        }
        a {
            text-decoration: none;
        }
        ul {
            list-style: none;
        }
        button {
            cursor: pointer;
            transition: 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        /* ===================== 顶部导航Header（与各页一致） ===================== */
        header {
            position: relative;             /* 移动端下拉菜单的定位参照 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 48px;
            background: #ffffff;
        }
        .logo-group {
            line-height: 1;
        }
        .logo-main {
            font-size: 32px;
            font-weight: 800;
            color: #0099cc;
        }
        .logo-sub {
            font-size: 11px;
            color: #556677;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        nav ul {
            display: flex;
            gap: 34px;
        }
        nav a {
            color: #425a6b;
            font-size: 15px;
            font-weight: 500;
        }
        nav a:hover {
            color: #0099cc;
        }
        nav a.active {
            color: #0099cc;
            font-weight: 700;
        }
        .btn-quote-top {
            background-color: #00b1d9;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-weight: 700;
            font-size: 14px;
        }
        .btn-quote-top:hover {
            background: #009cbf;
        }
        .menu-toggle {
            display: none;
            font-size: 28px;
            color: #425a6b;
            cursor: pointer;
            user-select: none;
        }

        /* ===================== 联系页面 ===================== */
        .ct-section {
            background: #E8F1FF;
            padding: 28px 140px 80px;      /* 左右留白，与 manufacturing/products 页一致 */
        }

        /* ---------- 主视觉区（左右布局：左侧文字 + 右侧图片） ---------- */
        .ct-hero {
            background: linear-gradient(135deg, #ffffff 0%, #E8F1FF 60%, #CFE2F5 100%);
            border-radius: 16px;
            padding: 64px 56px;
            display: flex;
            align-items: center;
            gap: 56px;
            text-align: left;
        }
        /* 左侧文字列 */
        .ct-hero-text {
            flex: 1;
        }
        .ct-hero-title {
            font-size: 60px;
            font-weight: 800;
            line-height: 1.1;
            color: #12344d;
            letter-spacing: -1px;
        }
        .ct-hero-sub {
            margin-top: 16px;
            font-size: 17px;
            color: #506270;
        }
        .ct-brand {
            margin-top: 32px;
            font-size: 22px;
            font-weight: 800;
            color: #0099cc;
            letter-spacing: 1px;
        }
        .ct-links {
            margin-top: 10px;
            font-size: 15px;
            color: #425a6b;
        }
        .ct-links a {
            color: #0099cc;
        }
        /* 右侧主图（a1.png）：文字在左、图片在右 */
        .ct-hero-img {
            flex: 0 0 42%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .ct-hero-img img {
            width: 100%;
            max-width: 100%;
            max-height: 420px;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            display: block;
        }

        /* ---------- 联系信息卡片 ---------- */
        .ct-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);   /* 删除官网后为三张卡片 */
            gap: 20px;
            margin-top: 40px;
        }
        .ct-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px 22px;
        }
        .ct-card-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #0099cc;
        }
        .ct-card-value {
            display: block;
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            color: #12344d;
        }

        /* ===================== 响应式 平板 <=992px ===================== */
        @media (max-width:992px) {
            header {
                padding: 18px 24px;
            }
            nav {
                display: block;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #ffffff;
                box-shadow: 0 6px 16px rgba(18,52,77,.08);
                max-height: 0;
                overflow: hidden;
                transition: max-height .3s ease;
                z-index: 99;
            }
            nav ul {
                flex-direction: column;
                gap: 0;
                padding: 8px 24px;
            }
            nav li {
                border-bottom: 1px solid #eef3f7;
            }
            nav li a {
                display: block;
                padding: 14px 0;
            }
            nav.menu-open {
                max-height: 600px;
            }
            .menu-toggle {
                display: block;
            }
            .ct-section {
                padding: 24px 24px 60px;
            }
            .ct-hero-title {
                font-size: 44px;
            }
            /* 联系卡片两列 */
            .ct-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* ===================== 响应式 手机 <=768px ===================== */
        @media (max-width:768px) {
            header {
                padding: 14px 16px;
            }
            .btn-quote-top {
                padding: 10px 16px;
                font-size: 13px;
            }
            .ct-section {
                padding: 18px 16px 40px;
            }
            .ct-hero {
                flex-direction: column;       /* 手机端：文字在上、图片在下 */
                align-items: flex-start;
                gap: 28px;
                padding: 32px 20px;
            }
            .ct-hero-img {
                flex: 1 1 auto;
                width: 100%;
            }
            .ct-hero-title {
                font-size: 32px;
            }
            /* 联系卡片单列 */
            .ct-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航区域（Contact 高亮） -->
    <header>
        <div class="logo-group">
            <div class="logo-main">ENSU.</div>
            <div class="logo-sub">MOUNTING TECHNOLOGY</div>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about us.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="#">R&D</a></li>
                <li><a href="manufacturing.html">Manufacturing</a></li>
                <li><a href="quality.html">Quality</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <div class="menu-toggle" onclick="document.querySelector('.nav').classList.toggle('menu-open')">☰</div>
        <button class="btn-quote-top" onclick="location.href='contact.html'">REQUEST A QUOTE</button>
    </header>

    <!-- 联系页面 -->
    <section class="ct-section">
        <!-- 主视觉区（左侧文字 + 右侧图片） -->
        <div class="ct-hero">
            <div class="ct-hero-text">
                <h1 class="ct-hero-title">LET'S BUILD WHAT'S NEXT.</h1>
                <p class="ct-hero-sub">For more ODM &amp; OEM solutions, talk to us.</p>
                <div class="ct-brand">ENSU TECHNOLOGY</div>
                <div class="ct-links">
                    <a href="mailto:td.wang@ensutek.com">td.wang@ensutek.com</a>
                </div>
            </div>
            <div class="ct-hero-img">
                <img src="images/a1.png" alt="ENSU products">
            </div>
        </div>

        <!-- 联系信息卡片 -->
        <div class="ct-cards">
            <div class="ct-card">
                <span class="ct-card-label">EMAIL</span>
                <span class="ct-card-value">td.wang@ensutek.com</span>
            </div>
            <div class="ct-card">
                <span class="ct-card-label">PHONE</span>
                <span class="ct-card-value">+8615968066653</span>
            </div>
            <div class="ct-card">
                <span class="ct-card-label">ADDRESS</span>
                <span class="ct-card-value">Ningbo, Zhejiang, China</span>
            </div>
        </div>
    </section>
</body>
</html>
